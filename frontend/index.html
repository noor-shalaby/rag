<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <!-- Critical for mobile responsiveness -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cura AI</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" type="image/png" href="favicon.png">
    </head>
    <body>

        <div class="chat-container">
            <div class="chat-header">
                <h1>Cura AI</h1>
                <p>Evidence-based answers backed by clinical literature</p>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <p>Hello! How can I help you analyze medical literature today?</p>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="queryInput" placeholder="Type your medical question here...">
                <button id="sendBtn">Send</button>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
