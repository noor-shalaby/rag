[tool.pyright]
venvPath = "."
venv = ".venv"

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cura-rag"
version = "1.0.0"
description = "Clinical RAG Assistant"
dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "google-genai",
    "supabase",
    "python-dotenv",
    "pydantic",
    "httpx"
]
